version: 2

sources:

  - name: raw
    database: AUTOMOTIVE_DBT_DB
    schema: RAW

    tables:

      - name: VEHICLE_SALES
        description: "Raw vehicle sales source."

        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour

          loaded_at_field: UPDATED_AT

      - name: DEALERS
        description: "Raw dealer source."

      - name: VEHICLES
        description: "Raw vehicle source."