version: 2

models:

  # ==========================================================
  # KPI SALES
  # Grain: SALE_DATE + REGION_SK + CURRENCY
  # ==========================================================

  - name: kpi_sales
    description: "Daily and monthly sales KPIs by region and currency for dashboard reporting."

    columns:

      - name: SALE_DATE
        description: "Date of the vehicle sale."
        tests:
          - not_null

      - name: SALES_MONTH
        description: "Month derived from SALE_DATE."
        tests:
          - not_null

      - name: REGION_SK
        description: "Surrogate key of the sales region."

      - name: REGION_NAME
        description: "Business name of the sales region."
        tests:
          - not_null

      - name: CURRENCY
        description: "Currency in which the sale amount is recorded."
        tests:
          - not_null

      - name: TOTAL_VEHICLES_SOLD
        description: "Distinct number of vehicles sold."
        tests:
          - not_null

      - name: TOTAL_SALES_AMOUNT
        description: "Total sales amount for the reporting grain."
        tests:
          - not_null

      - name: AVERAGE_SELLING_PRICE
        description: "Average selling price for the reporting grain."
        tests:
          - not_null

      - name: HIGH_VALUE_SALES
        description: "Number of high-value sales."
        tests:
          - not_null

      - name: CANCELLED_SALES
        description: "Number of cancelled sales."
        tests:
          - not_null


  # ==========================================================
  # KPI DEALER
  # Grain: SALE_DATE + DEALER_SK + CURRENCY
  # ==========================================================

  - name: kpi_dealer
    description: "Daily and monthly dealer sales and performance KPIs for dashboard reporting."

    columns:

      - name: SALE_DATE
        description: "Date of the vehicle sale."
        tests:
          - not_null

      - name: SALES_MONTH
        description: "Month derived from SALE_DATE."
        tests:
          - not_null

      - name: DEALER_SK
        description: "Surrogate key of the dealer."

      - name: DEALER_ID
        description: "Business identifier of the dealer."
        tests:
          - not_null

      - name: DEALER_NAME
        description: "Dealer business name."
        tests:
          - not_null

      - name: REGION_NAME
        description: "Region associated with the dealer."
        tests:
          - not_null

      - name: CURRENCY
        description: "Currency in which the sale amount is recorded."
        tests:
          - not_null

      - name: VEHICLES_SOLD
        description: "Distinct number of vehicles sold by the dealer."
        tests:
          - not_null

      - name: TOTAL_SALES_AMOUNT
        description: "Total sales amount generated by the dealer."
        tests:
          - not_null

      - name: AVERAGE_SELLING_PRICE
        description: "Average selling price for the dealer."
        tests:
          - not_null

      - name: HIGH_VALUE_SALES
        description: "Number of high-value sales generated by the dealer."
        tests:
          - not_null

      - name: CANCELLED_SALES
        description: "Number of cancelled sales generated by the dealer."
        tests:
          - not_null


  # ==========================================================
  # KPI VEHICLE
  # Grain: SALE_DATE + VEHICLE_SK + CURRENCY
  # ==========================================================

  - name: kpi_vehicle
    description: "Daily and monthly vehicle/model sales KPIs for dashboard reporting."

    columns:

      - name: SALE_DATE
        description: "Date of the vehicle sale."
        tests:
          - not_null

      - name: SALES_MONTH
        description: "Month derived from SALE_DATE."
        tests:
          - not_null

      - name: VEHICLE_SK
        description: "Surrogate key of the vehicle."
        tests:
          - not_null

      - name: VIN
        description: "Vehicle identification number."
        tests:
          - not_null

      - name: MODEL
        description: "Vehicle model."
        tests:
          - not_null

      - name: MODEL_YEAR
        description: "Vehicle model year."
        tests:
          - not_null

      - name: FUEL_TYPE
        description: "Fuel type of the vehicle."
        tests:
          - not_null

      - name: PLANT_CODE
        description: "Manufacturing plant code associated with the vehicle."
        tests:
          - not_null

      - name: CURRENCY
        description: "Currency in which the sale amount is recorded."
        tests:
          - not_null

      - name: VEHICLES_SOLD
        description: "Distinct number of vehicle sales."
        tests:
          - not_null

      - name: TOTAL_SALES_AMOUNT
        description: "Total sales amount for the vehicle reporting grain."
        tests:
          - not_null

      - name: AVERAGE_SELLING_PRICE
        description: "Average selling price for the vehicle reporting grain."
        tests:
          - not_null

      - name: HIGH_VALUE_SALES
        description: "Number of high-value sales."
        tests:
          - not_null

      - name: CANCELLED_SALES
        description: "Number of cancelled sales."
        tests:
          - not_null